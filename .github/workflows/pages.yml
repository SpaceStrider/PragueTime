name: GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Test the sync merge
        run: |
          npm ci
          npm test

      # Pull requests never receive secrets. On main, both secrets are available.
      # The assembler seals the trip when the code is set and leaves the trip out when it is not.
      - name: Assemble the locked site
        env:
          TRIP_GATE_CODE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.TRIP_GATE_CODE || '' }}
          TRIP_PRIVATE_JSON: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.TRIP_PRIVATE_JSON || '' }}
        run: node --experimental-strip-types scripts/assemble-site.ts

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
